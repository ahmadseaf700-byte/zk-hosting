name: Android APK
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/android-embedded-jvm-foundation]
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-apk.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dragonhost-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
